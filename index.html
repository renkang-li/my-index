<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李仁康的码头时刻 | 个人主页</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffb482; font-family: 'Noto Sans SC', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 6vw; box-sizing: border-box; }
        
        .card {
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid #264653;
            border-radius: 12px;
            padding: 30px;
            max-width: 420px;
            pointer-events: auto;
            box-shadow: 8px 8px 0px #2a9d8f;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px #2a9d8f; }
        
        h1 { font-family: 'DotGothic16', sans-serif; font-size: 32px; margin: 0 0 15px 0; color: #e76f51; }
        h2 { font-size: 16px; color: #264653; margin-top: 0; margin-bottom: 20px; font-weight: bold; }
        ul { padding-left: 20px; color: #264653; font-size: 15px; line-height: 1.8; margin-bottom: 25px; list-style-type: square; }
        .quote { font-family: 'DotGothic16', sans-serif; color: #2a9d8f; font-weight: bold; margin-bottom: 20px; font-size: 18px; background: #fff; padding: 10px; border: 2px dashed #2a9d8f; display: inline-block; }
        
        .links { display: flex; gap: 15px; flex-wrap: wrap; }
        .links a { text-decoration: none; color: #fff; background: #264653; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; transition: all 0.2s; box-shadow: 4px 4px 0px #1d3557; }
        .links a:hover { background: #e76f51; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #1d3557; }
        .links a:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #1d3557; }
        
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    
    <div id="ui-container">
        <div class="card">
            <h1>> 李仁康 _</h1>
            <h2>跨境全栈开发者 / 前端基础架构师</h2>
            <div class="quote">“代码跑通了，去码头整点薯条。”</div>
            <ul>
                <li>专注 Shopify 类独立站开发与跨境电商前端基础设施</li>
                <li>精通广告像素追踪 (Pixel) 与复杂数据链路治理</li>
                <li>深耕监控体系性能调优、白屏治理及自动化 CI/CD</li>
                <li>探索 WebGL 视觉体验，主页阵地：lrk.666.eu.org</li>
            </ul>
            <div class="links">
                <a href="#github" target="_blank">GitHub</a>
                <a href="#projects" target="_blank">项目模板库</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let scrollPos = 0;
        let pigeons = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            pigeons = [
                { x: width * 0.8, y: height * 0.73, speed: 1, type: 'walk', offset: 0 },
                { x: width * 1.2, y: height * 0.74, speed: 1.2, type: 'walk', offset: 1 },
                { x: width * 0.5, y: height * 0.2, speed: 3, type: 'fly', offset: 2 },
                { x: width * 1.5, y: height * 0.15, speed: 3.5, type: 'fly', offset: 3 }
            ];
        }

        window.addEventListener('resize', resize);
        resize();

        function drawBackground(time) {
            scrollPos += 1.5; // Leisurely scroll speed
            
            // Sky (Sunset)
            ctx.fillStyle = '#ffb482';
            ctx.fillRect(0, 0, width, height);
            
            // Sun
            ctx.fillStyle = '#e76f51';
            ctx.beginPath();
            ctx.arc(width * 0.7, height * 0.4, Math.min(width, height) * 0.15, 0, Math.PI * 2);
            ctx.fill();
            
            // Sea
            const seaY = height * 0.55;
            ctx.fillStyle = '#2a9d8f';
            ctx.fillRect(0, seaY, width, height - seaY);
            
            // Distant Cafe & Pier (Parallax slow)
            const cafeSpacing = 1200;
            const layer1Scroll = scrollPos * 0.4;
            const startX1 = -(layer1Scroll % cafeSpacing);
            
            for(let x = startX1; x < width + cafeSpacing; x += cafeSpacing) {
                // Cafe Building
                ctx.fillStyle = '#e9c46a';
                ctx.fillRect(x, seaY - 120, 260, 120);
                // Windows
                ctx.fillStyle = '#8ab4f8';
                ctx.fillRect(x + 30, seaY - 90, 70, 50);
                ctx.fillRect(x + 120, seaY - 90, 70, 50);
                // Awning
                for(let i = 0; i < 13; i++) {
                    ctx.fillStyle = (i % 2 === 0) ? '#e63946' : '#f1faee';
                    ctx.fillRect(x + i * 20, seaY - 130, 20, 30);
                }
                
                // Open-air Tables (露天咖啡桌)
                ctx.fillStyle = '#e76f51'; // Table color
                ctx.fillRect(x - 60, seaY - 20, 40, 6); // table top
                ctx.fillRect(x - 45, seaY - 14, 10, 14); // table leg
                
                ctx.fillRect(x + 280, seaY - 20, 40, 6); 
                ctx.fillRect(x + 295, seaY - 14, 10, 14);
                
                // Chairs
                ctx.fillStyle = '#264653';
                ctx.fillRect(x - 80, seaY - 15, 10, 5); // left chair
                ctx.fillRect(x - 15, seaY - 15, 10, 5); // right chair
                
                ctx.fillRect(x + 260, seaY - 15, 10, 5);
                ctx.fillRect(x + 325, seaY - 15, 10, 5);
            }
            
            // Pier Floor
            const groundY = height * 0.75;
            ctx.fillStyle = '#e7c697';
            ctx.fillRect(0, groundY, width, height - groundY);
            
            // Pier Edge details (wooden planks)
            ctx.fillStyle = '#d4a373';
            ctx.fillRect(0, groundY, width, 10);
            
            // Pier Railing (Parallax fast)
            const railSpacing = 160;
            const startX2 = -(scrollPos % railSpacing);
            ctx.fillStyle = '#264653';
            
            // Posts
            for(let x = startX2; x < width + railSpacing; x += railSpacing) {
                ctx.fillRect(x + 60, groundY - 70, 20, 70);
            }
            // Top rail
            ctx.fillRect(0, groundY - 70, width, 15);
            // Middle rail
            ctx.fillRect(0, groundY - 35, width, 8);
        }

        function drawPigeons(time) {
            pigeons.forEach(p => {
                p.x -= (p.speed + (p.type === 'walk' ? 1.5 : 0)); // Move left with ground or fly
                if (p.x < -100) {
                    p.x = width + 200 + Math.random() * 500;
                    if (p.type === 'fly') p.y = height * 0.1 + Math.random() * height * 0.3;
                }
                
                ctx.save();
                if (p.type === 'walk') {
                    // Walking pigeon
                    const bounce = Math.abs(Math.sin(time * 8 + p.offset)) * 4;
                    ctx.translate(p.x, p.y - bounce);
                    
                    ctx.fillStyle = '#ffffff'; // body
                    ctx.fillRect(-12, -12, 24, 16);
                    ctx.fillStyle = '#e76f51'; // beak
                    ctx.fillRect(-18, -8, 6, 6);
                    ctx.fillStyle = '#2b2b2b'; // eye
                    ctx.fillRect(-10, -8, 4, 4);
                    // legs
                    ctx.fillStyle = '#e76f51';
                    ctx.fillRect(-4, 4, 4, 6);
                    ctx.fillRect(4, 4, 4, 6);
                } else {
                    // Flying pigeon
                    ctx.translate(p.x, p.y + Math.sin(time * 3 + p.offset) * 20);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-18, -6, 36, 12); // body
                    // wings
                    const flap = Math.sin(time * 12 + p.offset);
                    if (flap > 0) {
                        ctx.fillRect(-8, -20, 16, 14); // wing up
                    } else {
                        ctx.fillRect(-8, 6, 16, 14); // wing down
                    }
                }
                ctx.restore();
            });
        }

        function drawBoy(time) {
            const x = width * 0.35;
            const groundY = height * 0.75;
            
            const speed = 5;
            const walkCycle = time * speed;
            const leg1 = Math.sin(walkCycle);
            const leg2 = Math.sin(walkCycle + Math.PI);
            
            ctx.save();
            ctx.translate(x, groundY);
            
            // Leisurely bounce
            ctx.translate(0, -Math.abs(Math.sin(walkCycle * 2)) * 6);
            
            const skin = '#ffcdb2';
            const shirt = '#e9c46a';
            const pants = '#264653';
            
            // Back Arm
            ctx.save();
            ctx.translate(2, -65);
            ctx.rotate(leg2 * 0.5); 
            ctx.fillStyle = skin;
            ctx.fillRect(-6, 0, 12, 35);
            ctx.restore();
            
            // Back Leg
            ctx.save();
            ctx.translate(0, -35);
            ctx.rotate(leg2 * 0.6);
            ctx.fillStyle = pants;
            ctx.fillRect(-8, 0, 16, 38);
            ctx.restore();
            
            // Body
            ctx.fillStyle = shirt;
            ctx.fillRect(-16, -75, 32, 45);
            
            // Head
            ctx.save();
            // Slight head bob
            ctx.translate(0, Math.sin(walkCycle * 2) * 2);
            ctx.fillStyle = skin;
            ctx.fillRect(-14, -108, 28, 30);
            // Hair
            ctx.fillStyle = '#2b2b2b';
            ctx.fillRect(-16, -114, 32, 14); // top hair
            ctx.fillRect(8, -108, 8, 16); // bangs
            ctx.fillRect(-16, -108, 8, 18); // back hair
            // Eye
            ctx.fillStyle = '#2b2b2b';
            ctx.fillRect(6, -95, 4, 6);
            ctx.restore();
            
            // Front Leg
            ctx.save();
            ctx.translate(0, -35);
            ctx.rotate(leg1 * 0.6);
            ctx.fillStyle = pants;
            ctx.fillRect(-8, 0, 16, 38);
            ctx.restore();
            
            // Front Arm
            ctx.save();
            ctx.translate(-2, -65);
            ctx.rotate(leg1 * 0.5);
            ctx.fillStyle = skin;
            ctx.fillRect(-6, 0, 12, 35);
            // Sleeve
            ctx.fillStyle = shirt;
            ctx.fillRect(-7, 0, 14, 12);
            ctx.restore();
            
            ctx.restore();
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);
            const time = timestamp / 1000;
            
            ctx.clearRect(0, 0, width, height);
            
            drawBackground(time);
            drawPigeons(time);
            drawBoy(time);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
